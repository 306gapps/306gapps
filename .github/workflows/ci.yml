name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test -race ./...

      # Recovery runs busybox ash, which has no bashisms. /bin/sh here is dash,
      # which is the closest strict POSIX shell available and rejects the same
      # things. Every template, not a hand-listed subset: the uninstaller was
      # missing from this list and went unchecked.
      - name: Installer scripts are POSIX sh
        run: |
          fail=0
          for f in $(git ls-files 'internal/build/templates/*' | grep -v NOTICE); do
            sh -n "$f" || { echo "::error file=$f::not POSIX sh"; fail=1; }
          done
          exit $fail

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh -S warning \
            $(git ls-files 'internal/build/templates/*' | grep -v NOTICE)

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: go build -o /tmp/306gapps ./cmd/306gapps

      # The suites check the signature with openssl rather than with our own
      # verifier, so it has to be present.
      - name: openssl is available
        run: openssl version

      - name: Install the real installer into a fake ROM
        run: |
          python3 test/installer/make_fixture.py /tmp/fixture
          ./test/installer/run.sh /tmp/306gapps /tmp/fixture

      - name: Drive the ota target against a synthetic target-files package
        run: ./test/ota/run.sh /tmp/306gapps /tmp/fixture

      - name: Install then uninstall, and check nothing of ours survives
        run: ./test/uninstaller/run.sh /tmp/306gapps /tmp/fixture

  # The desktop picker is behind a build tag so the command line stays pure Go
  # and cross-compiles without a toolchain. That means it needs its own job, or
  # it would rot unbuilt.
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install the GUI toolkit's build dependencies
        run: |
          sudo apt-get update -qq
          # The toolkit's glfw builds both an X11 and a Wayland backend, so it
          # needs the Wayland headers even to compile for X11.
          sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols
      - run: go build -tags gui ./cmd/306gapps-gui
      - run: go vet -tags gui ./internal/gui/
      - run: go test -tags gui ./internal/gui/

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o dist/ ./cmd/306gapps
      - uses: actions/upload-artifact@v4
        with:
          name: 306gapps-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
