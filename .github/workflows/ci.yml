name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test -race ./...

      - name: Installer scripts are POSIX sh
        run: |
          for f in internal/build/templates/recovery/update-binary \
                   internal/build/templates/recovery/*.sh \
                   internal/build/templates/module/*; do
            sh -n "$f" || exit 1
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh -S warning \
            internal/build/templates/recovery/update-binary \
            internal/build/templates/recovery/*.sh \
            internal/build/templates/module/*

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: go build -o /tmp/306gapps ./cmd/306gapps

      - name: Install the real installer into a fake ROM
        run: |
          python3 test/installer/make_fixture.py /tmp/fixture
          ./test/installer/run.sh /tmp/306gapps /tmp/fixture

      - name: Drive the ota target against a synthetic target-files package
        run: ./test/ota/run.sh /tmp/306gapps /tmp/fixture

      - name: Install then uninstall, and check nothing of ours survives
        run: ./test/uninstaller/run.sh /tmp/306gapps /tmp/fixture

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o dist/ ./cmd/306gapps
      - uses: actions/upload-artifact@v4
        with:
          name: 306gapps-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
