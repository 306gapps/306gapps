name: release

# A tag publishes. A push to dev only builds artifacts, so the run says which
# it is rather than every run reading as "release".
run-name: >-
  ${{ github.ref_type == 'tag'
      && format('release {0}', github.ref_name)
      || format('dev build {0}', github.sha) }}

# Publishes binaries for a tag. The command line is pure Go and cross-compiles
# from anywhere; the picker needs cgo for the GUI toolkit, so it is built on a
# runner of the operating system it is for rather than cross-compiled.
on:
  push:
    tags: ["v*"]
    # A push to dev builds the same six binaries and uploads them as
    # artifacts. Nothing is published: the publish job is gated on the run
    # being for a tag, so this is the same pipeline people can test against
    # rather than a second one that might drift from it.
    branches: [dev]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to stamp (no release is published without a tag)"
        required: false
        default: "v0.0.0-test"

permissions:
  contents: write

env:
  GO_VERSION: "1.27"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      # Needed for the branch build, which names itself after the commit.
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            # A branch build: name it after the branch and the commit, so a
            # tester can say exactly which build they ran.
            echo "version=${{ github.ref_name }}-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # Targets whose desktop picker needs a GUI toolchain are built on a runner of
  # that architecture: cgo cannot be cross-compiled without one. The rest are
  # pure Go and build anywhere.
  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     goos: linux,   goarch: amd64 }
          - { os: ubuntu-22.04-arm, goos: linux,   goarch: arm64 }
          - { os: windows-latest,   goos: windows, goarch: amd64, ext: ".exe" }
          - { os: windows-11-arm,   goos: windows, goarch: arm64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # glfw compiles both an X11 and a Wayland backend, so the Wayland headers
      # are needed even though the binary also runs under plain X11.
      - name: GUI toolkit build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      # The arm64 Windows image ships an x86-64 mingw gcc, which cannot
      # assemble aarch64 -- cgo fails on runtime/cgo's gcc_arm64.S with "no
      # such instruction: stp". llvm-mingw provides a native aarch64 clang.
      - name: A C toolchain that can target arm64
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $v = "20260922"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-aarch64.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\ -Force
          $bin = "C:\llvm-mingw-$v-ucrt-aarch64\bin"
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CC=$bin\aarch64-w64-mingw32-clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CXX=$bin\aarch64-w64-mingw32-clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Windows takes its executable icon from a linked resource object, not
      # from anything Go knows about.
      - name: Executable icon
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          go run github.com/akavel/rsrc@v0.10.2 \
            -ico docs/icon.ico -arch ${{ matrix.goarch }} -o cmd/306gapps/rsrc.syso

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          V: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          go build -trimpath -tags gui \
            -ldflags "-s -w -X github.com/306gapps/306gapps/internal/version.Version=$V" \
            -o "dist/306gapps-$V-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/306gapps
      - name: It is what it says
        shell: bash
        run: ls -l dist/ && (file dist/* || true)
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # macOS is command line only: no desktop picker is built for it, so these
  # cross-compile as pure Go from anywhere.
  darwin:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          V: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/306gapps/306gapps/internal/version.Version=$V" \
            -o "dist/306gapps-$V-darwin-${{ matrix.goarch }}" ./cmd/306gapps
      - uses: actions/upload-artifact@v4
        with:
          name: bin-darwin-${{ matrix.goarch }}
          path: dist/

  # Every update has to be signed with the same key or Android refuses to
  # install it over the last one, so the key is a secret, never generated here.
  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.13113456" > /dev/null
      - run: go install tool
      - run: android/build-core.sh

      # A branch build without the secret still builds, unsigned. A release
      # without a signed apk is broken, so a tag refuses to go ahead.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set"
              exit 1
            fi
            echo "no signing key; the apk will be unsigned"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "GAPPS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          GAPPS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GAPPS_KEY_ALIAS: "306gapps"
          V: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew --console=plain -PgappsVersion="$V" testReleaseUnitTest assembleRelease
          out=app/build/outputs/apk/release
          apk="$out/app-release.apk"
          [ -f "$apk" ] || apk="$out/app-release-unsigned.apk"
          mkdir -p ../dist
          cp "$apk" "../dist/306gapps-$V-android-arm64.apk"

      - name: It is what it says
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          apk="dist/306gapps-$V-android-arm64.apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" | head -1
          if [ -n "${GAPPS_KEYSTORE:-}" ]; then
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-android-arm64
          path: dist/

  publish:
    needs: [version, native, darwin, android]
    runs-on: ubuntu-latest
    steps:
      # Full history: the notes are built from the commits since the last tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Collect
        run: |
          mkdir -p dist
          find staging -type f -exec mv {} dist/ \;
          chmod +x dist/* || true
          ls -l dist/

      # A binary that cannot start is worse than no release at all.
      - name: The Linux command line runs and reports its version
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          bin="dist/306gapps-$V-linux-amd64"
          chmod +x "$bin"
          got=$("$bin" version)
          echo "$got"
          [ "$got" = "306gapps $V" ] || { echo "::error::version mismatch: $got"; exit 1; }

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: 306gapps-${{ needs.version.outputs.version }}
          path: dist/
          retention-days: 30

      # The notes are the template plus either a written changelog for the tag
      # or, failing that, the commit subjects since the last one. Editing the
      # template is how the standing preamble changes.
      - name: Release notes
        if: needs.version.outputs.publish == 'true'
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          cp .github/release-notes.md notes.md
          prev=$(git describe --tags --abbrev=0 "$V^" 2>/dev/null || true)
          if [ -f ".github/changelog/$V.md" ]; then
            cat ".github/changelog/$V.md" >> notes.md
            if [ -n "$prev" ]; then
              echo ""
              echo "Full changes: https://github.com/${{ github.repository }}/compare/$prev...$V"
            fi >> notes.md
          elif [ -n "$prev" ]; then
            {
              git log --no-merges --format='- %s' "$prev..$V"
              echo ""
              echo "Full changes: https://github.com/${{ github.repository }}/compare/$prev...$V"
            } >> notes.md
          else
            git log --no-merges --format='- %s' "$V" >> notes.md
          fi
          cat notes.md

      - name: Publish the release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: gh release create "$V" dist/* --title "$V" --notes-file notes.md
